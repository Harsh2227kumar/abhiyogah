[project]
name = "abhiyogah"
version = "0.1.0"
description = "RBI complaint-compliance engine: clause-cited deadlines, breaches and compensation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "holidays",
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2",
    "psycopg[binary]>=3",
    "alembic",
    "procrastinate",
    "httpx",
    "structlog",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "mypy",
    "ruff",
    "import-linter",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abhiyogah"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "BLE", "C4", "SIM", "RUF", "DTZ", "PT"]
ignore = []
# RBI instrument titles use en dashes.
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "db: needs a PostgreSQL database (skipped when DATABASE_URL is unset)",
]
