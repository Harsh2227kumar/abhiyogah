hand_check: |
  Source: IO Directions 2026 cl. 14(1)(a)-(b) (report Table A, row A13, verification P): only a
  partially resolved or wholly rejected complaint is auto-escalated.
  OUTCOME_SET FULLY_RESOLVED on 2026-08-05; the condition "outcome in [PARTIALLY_RESOLVED,
  WHOLLY_REJECTED]" is false for both limbs, so both are NOT_TRIGGERED.
  as_of 2026-09-30 is 58 days after receipt (2026-08-03), yet there is no deadline and no breach.
