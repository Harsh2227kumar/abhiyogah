name: failed_txn_aeps_beneficiary_unverified
description: >
  A failed AePS beneficiary credit is still not reversed four days after T+1. Only the illegible-row
  rule (B2, unverified) computes it; the verified table (B1) has no AePS beneficiary row.
obligation_ids: [TAT-2019-ILLEGIBLE-ROWS, TAT-2019-FAILED-TXN]
hand_check: |
  Source: RBI/2019-20/67 Annex row 5b (report Table B, row B2): AePS beneficiary T+1, ₹100/day.
  Verification U (row illegible, Q5): every number below is UNVERIFIED.
  n = 1. T = 2026-08-10. due_date = T + 1 = 2026-08-11
  No REVERSAL_POSTED; as_of IST date 2026-08-15 > 2026-08-11: BREACHED, days_late = 4.
  Accrued to as_of: 10000 x 4 = 40000 paise (Rs 400), unverified. Required action: REVERSE_TRANSACTION.
  B1 (row B1, P): AEPS_BENEFICIARY is not in its verified table: INSUFFICIENT_FACTS; nothing is
  assumed from the unverified row.
entity_profile:
  entity_type: COMMERCIAL_BANK
  outlets: 120
  outlets_as_on: 2025-03-31
  home_branch_state: MH
events:
  - type: BANK_RECEIVED
    occurred_at: 2026-08-11T10:00:00+05:30
    payload: {issue_type: FAILED_TRANSACTION, channel: AEPS_BENEFICIARY, transaction_date_t: "2026-08-10", amount_paise: 300000}
as_of: 2026-08-15T12:00:00+05:30
expect:
  results:
    TAT-2019-ILLEGIBLE-ROWS: BREACHED
    TAT-2019-FAILED-TXN: INSUFFICIENT_FACTS
  deadlines:
    - {obligation_id: TAT-2019-ILLEGIBLE-ROWS, due_date: 2026-08-11, result: BREACHED}
  breaches:
    - {obligation_id: TAT-2019-ILLEGIBLE-ROWS, due_date: 2026-08-11, days_late: 4}
  compensation_paise:
    TAT-2019-ILLEGIBLE-ROWS: 40000
  required_actions:
    - {obligation_id: TAT-2019-ILLEGIBLE-ROWS, action: REVERSE_TRANSACTION}
