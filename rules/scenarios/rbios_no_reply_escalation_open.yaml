name: rbios_no_reply_escalation_open
description: >
  The bank has not replied 30 days after receipt; the complainant may now escalate to the RBI
  Ombudsman. This is a permission opening, not a breach entry.
obligation_ids: [RBIOS-2026-10-1-f]
hand_check: |
  Source: RB-IOS 2026 cl. 10(1)(f) (report Table A, row A2, verification P). Report formula:
  bank_deadline = max(bank_receipt + 30d, bank_receipt + external_TAT);
  escalation_open = no_reply_by(bank_deadline) OR customer_dissatisfied.
  Day basis: calendar, inferred (Q4). A2 is a PERMISSION of the complainant: no breach, no action.
  bank_receipt_date = 2026-08-03; due_date = 2026-08-03 + 30 days = 2026-09-02
  No FINAL_REPLY_SENT. as_of IST date 2026-09-03 > 2026-09-02, so the clock is BREACHED.
  no_reply_by(2026-09-02) is true, so escalation_open = true.
  deontic PERMISSION: breaches and required_actions stay empty.
entity_profile:
  entity_type: COMMERCIAL_BANK
  outlets: 120
  outlets_as_on: 2025-03-31
  home_branch_state: MH
events:
  - type: BANK_RECEIVED
    occurred_at: 2026-08-03T11:00:00+05:30
  - type: ACKNOWLEDGED
    occurred_at: 2026-08-03T11:05:00+05:30
as_of: 2026-09-03T09:00:00+05:30
expect:
  results:
    RBIOS-2026-10-1-f: BREACHED
  outputs:
    RBIOS-2026-10-1-f: {escalation_open: true}
  deadlines:
    - {obligation_id: RBIOS-2026-10-1-f, due_date: 2026-09-02, result: BREACHED}
  breaches: []
  compensation_paise: {}
  required_actions: []
