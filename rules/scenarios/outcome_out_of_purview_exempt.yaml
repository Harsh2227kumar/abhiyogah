name: outcome_out_of_purview_exempt
description: >
  An out-of-purview complaint (IO cl. 14(5)(c)) is replied to without one of the three outcomes; it
  is exempt from the three-state rule, so the check does not trigger.
obligation_ids: [IO-CB-2026-14-2]
hand_check: |
  Source: IO Directions 2026 cl. 14(2) and 14(5) (report Table A, rows A14 and A16, verification P):
  out-of-purview complaints under cl. 14(5)(c)-(e) are exempt from the three-state outcome rule.
  exclusion_category = 14_5_c. Trigger condition "exclusion_category is not set or
  exclusion_category not in [14_5_c, 14_5_d, 14_5_e]": both clauses false, so NOT_TRIGGERED, even
  though no outcome was recorded (compare outcome_missing_at_closure, which is not exempt).
