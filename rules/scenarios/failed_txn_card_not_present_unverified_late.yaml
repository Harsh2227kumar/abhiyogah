name: failed_txn_card_not_present_unverified_late
description: >
  A failed card-not-present payment is reversed two days after T+5. Only the illegible-row rule (B2,
  unverified) computes it; the verified table (B1) has no card-not-present row.
obligation_ids: [TAT-2019-ILLEGIBLE-ROWS, TAT-2019-FAILED-TXN]
hand_check: |
  Source: RBI/2019-20/67 Annex row 2c (report Table B, row B2): card-not-present T+5, ₹100/day.
  Verification U (row illegible, Q5): every number below is UNVERIFIED.
  n = 5. T = 2026-08-10. due_date = T + 5 = 2026-08-15
  REVERSAL_POSTED R = 2026-08-17 > 2026-08-15: STOPPED_LATE, days_late = 2.
  compensation = 10000 x 2 = 20000 paise (Rs 200), unverified.
  B1 (TAT-2019-FAILED-TXN, row B1, P): CARD_NOT_PRESENT is not in its verified table, so
  INSUFFICIENT_FACTS there; nothing is assumed from the unverified row.
entity_profile:
  entity_type: COMMERCIAL_BANK
  outlets: 120
  outlets_as_on: 2025-03-31
  home_branch_state: MH
events:
  - type: BANK_RECEIVED
    occurred_at: 2026-08-11T10:00:00+05:30
    payload: {issue_type: FAILED_TRANSACTION, channel: CARD_NOT_PRESENT, transaction_date_t: "2026-08-10", amount_paise: 189900}
  - type: REVERSAL_POSTED
    occurred_at: 2026-08-17T11:00:00+05:30
as_of: 2026-08-18T12:00:00+05:30
expect:
  results:
    TAT-2019-ILLEGIBLE-ROWS: STOPPED_LATE
    TAT-2019-FAILED-TXN: INSUFFICIENT_FACTS
  deadlines:
    - {obligation_id: TAT-2019-ILLEGIBLE-ROWS, due_date: 2026-08-15, result: STOPPED_LATE}
  breaches:
    - {obligation_id: TAT-2019-ILLEGIBLE-ROWS, due_date: 2026-08-15, days_late: 2}
  compensation_paise:
    TAT-2019-ILLEGIBLE-ROWS: 20000
  required_actions: []
