name: outcome_set_after_closure
description: >
  The outcome is recorded two days after the final reply; the closure was not classified, and the late record cannot undo that.
obligation_ids: [IO-CB-2026-14-2]
hand_check: |
  Source: IO Directions 2026 cl. 14(2) (report Table A, row A14, verification P): only "Fully
  Resolved", "Partially Resolved" or "Wholly Rejected"; compliance by 30 Jun 2026. Check obligation:
  at FINAL_REPLY_SENT, outcome must be set with outcome_date <= final_reply_date.
  outcome_date 2026-08-14 > final_reply_date 2026-08-12, so classified_at_closure = false.
  The outcome is now set, so there is nothing left to do: no SET_OUTCOME action.
  (A13 would now trigger on the WHOLLY_REJECTED outcome; it is not evaluated in this scenario.)
