  for UPI_P2P: NOT_TRIGGERED.
  B1 (RBI/2019-20/67 Annex, report row B1, P): UPI P2P n = 1; T = 2026-08-10; due_date = 2026-08-11.
  REVERSAL_POSTED R = 2026-08-11 <= 2026-08-11: STOPPED_ON_TIME; compensation 0.
entity_profile:
  entity_type: COMMERCIAL_BANK
  outlets: 120
  outlets_as_on: 2025-03-31
  home_branch_state: MH
events:
  - type: BANK_RECEIVED
    occurred_at: 2026-08-10T21:00:00+05:30
    payload: {issue_type: FAILED_TRANSACTION, channel: UPI_P2P, transaction_date_t: "2026-08-10", amount_paise: 50000}
  - type: REVERSAL_POSTED
    occurred_at: 2026-08-11T09:00:00+05:30
as_of: 2026-08-12T12:00:00+05:30
expect:
