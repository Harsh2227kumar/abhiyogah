name: failed_txn_upi_outside_illegible_rows
description: >
  A failed UPI P2P transfer reversed on T+1 is handled by the verified table only; the illegible-row
  rule does not trigger.
obligation_ids: [TAT-2019-ILLEGIBLE-ROWS, TAT-2019-FAILED-TXN]
hand_check: |
