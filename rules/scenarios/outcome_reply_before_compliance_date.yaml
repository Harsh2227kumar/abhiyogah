name: outcome_reply_before_compliance_date
description: >
  A final reply sent before the 30 June 2026 compliance date is outside the three-state rule.
obligation_ids: [IO-CB-2026-14-2]
hand_check: |
  Source: IO Directions 2026 cl. 14(2) (report Table A, row A14, verification P): only "Fully
  Resolved", "Partially Resolved" or "Wholly Rejected"; compliance by 30 Jun 2026. Check obligation:
  at FINAL_REPLY_SENT, outcome must be set with outcome_date <= final_reply_date.
  anchor final_reply_date = 2026-06-15 < 2026-06-30, the first effective date of allowed_outcomes,
  so the rule did not apply then: NOT_APPLICABLE, even though no outcome was recorded.
