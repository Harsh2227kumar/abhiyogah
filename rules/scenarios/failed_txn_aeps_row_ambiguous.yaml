name: failed_txn_aeps_row_ambiguous
description: >
  A failed AePS transaction with channel AEPS cannot be placed in the merchant (T+5) or beneficiary
  (T+1) row, so the engine assumes neither and reports insufficient facts.
obligation_ids: [TAT-2019-FAILED-TXN]
hand_check: |
  Source: RBI/2019-20/67 Annex (report Table B, row B1, verification P). Formula:
  compensation = 100 x max(0, R - (T + n)) rupees, calendar days (T is a calendar date: EXPLICIT),
  credited suo motu. 100 rupees = 10000 paise.
  The annex has two AePS rows: merchant T+5 (B1, P) and beneficiary T+1 (B2, U). The B1 table key is
  AEPS_MERCHANT; channel AEPS matches no key, so the TAT n is unknown: INSUFFICIENT_FACTS, no deadline,
  no compensation. (Channel split requested in issue #20.)
entity_profile:
  entity_type: COMMERCIAL_BANK
  outlets: 120
  outlets_as_on: 2025-03-31
  home_branch_state: MH
events:
  - type: BANK_RECEIVED
    occurred_at: 2026-08-11T10:00:00+05:30
    payload: {issue_type: FAILED_TRANSACTION, channel: AEPS, transaction_date_t: "2026-08-10", amount_paise: 300000}
as_of: 2026-08-20T12:00:00+05:30
expect:
  results:
    TAT-2019-FAILED-TXN: INSUFFICIENT_FACTS
  deadlines: []
  breaches: []
  compensation_paise: {}
  required_actions: []
