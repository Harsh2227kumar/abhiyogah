name: rbios_dissatisfied_before_30_days
description: >
  The bank replies on day 7 and the complainant states dissatisfaction on day 9; the escalation route
  opens at once, without waiting for 30 days.
obligation_ids: [RBIOS-2026-10-1-f]
hand_check: |
  Source: RB-IOS 2026 cl. 10(1)(f) (report Table A, row A2, verification P). Report formula:
  bank_deadline = max(bank_receipt + 30d, bank_receipt + external_TAT);
  escalation_open = no_reply_by(bank_deadline) OR customer_dissatisfied.
  Day basis: calendar, inferred (Q4). A2 is a PERMISSION of the complainant: no breach, no action.
  bank_receipt_date = 2026-08-03; due_date = 2026-08-03 + 30 days = 2026-09-02
  FINAL_REPLY_SENT on 2026-08-10 <= 2026-09-02, so STOPPED_ON_TIME.
  CUSTOMER_DISSATISFIED on 2026-08-12, so escalation_open = true (second limb of the OR).
entity_profile:
  entity_type: COMMERCIAL_BANK
  outlets: 120
  outlets_as_on: 2025-03-31
  home_branch_state: MH
events:
  - type: BANK_RECEIVED
    occurred_at: 2026-08-03T11:00:00+05:30
  - type: FINAL_REPLY_SENT
    occurred_at: 2026-08-10T16:00:00+05:30
  - type: CUSTOMER_DISSATISFIED
    occurred_at: 2026-08-12T10:00:00+05:30
    source: HUMAN
as_of: 2026-08-15T12:00:00+05:30
expect:
  results:
    RBIOS-2026-10-1-f: STOPPED_ON_TIME
  outputs:
    RBIOS-2026-10-1-f: {escalation_open: true}
  deadlines:
    - {obligation_id: RBIOS-2026-10-1-f, due_date: 2026-09-02, result: STOPPED_ON_TIME}
  breaches: []
  compensation_paise: {}
  required_actions: []
