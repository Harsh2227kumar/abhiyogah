name: failed_txn_upi_p2p_reversed_late
description: >
  A failed UPI P2P transfer is reversed three days after T+1; the bank owes ₹300 without a claim.
obligation_ids: [TAT-2019-FAILED-TXN]
hand_check: |
  Source: RBI/2019-20/67 Annex (report Table B, row B1, verification P). Formula:
  compensation = 100 x max(0, R - (T + n)) rupees, calendar days (T is a calendar date: EXPLICIT),
  credited suo motu. 100 rupees = 10000 paise.
  UPI P2P row: n = 1. T = 2026-08-10. due_date = T + 1 = 2026-08-11
  REVERSAL_POSTED R = 2026-08-14 > 2026-08-11: STOPPED_LATE, days_late = 2026-08-14 - 2026-08-11 = 3
  compensation = 10000 x 3 = 30000 paise (Rs 300)
entity_profile:
  entity_type: COMMERCIAL_BANK
  outlets: 120
  outlets_as_on: 2025-03-31
  home_branch_state: MH
events:
  - type: BANK_RECEIVED
    occurred_at: 2026-08-11T09:00:00+05:30
    payload: {issue_type: FAILED_TRANSACTION, channel: UPI_P2P, transaction_date_t: "2026-08-10", amount_paise: 250000}
  - type: REVERSAL_POSTED
    occurred_at: 2026-08-14T13:00:00+05:30
as_of: 2026-08-16T12:00:00+05:30
expect:
  results:
    TAT-2019-FAILED-TXN: STOPPED_LATE
  deadlines:
    - {obligation_id: TAT-2019-FAILED-TXN, due_date: 2026-08-11, result: STOPPED_LATE}
  breaches:
    - {obligation_id: TAT-2019-FAILED-TXN, due_date: 2026-08-11, days_late: 3}
  compensation_paise:
    TAT-2019-FAILED-TXN: 30000
  required_actions: []
