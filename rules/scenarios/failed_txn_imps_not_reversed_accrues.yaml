name: failed_txn_imps_not_reversed_accrues
description: >
  A failed IMPS transfer is still not reversed nine days after T+1; ₹900 has accrued so far and the
  reversal is still required.
obligation_ids: [TAT-2019-FAILED-TXN]
hand_check: |
  Source: RBI/2019-20/67 Annex (report Table B, row B1, verification P). Formula:
  compensation = 100 x max(0, R - (T + n)) rupees, calendar days (T is a calendar date: EXPLICIT),
  credited suo motu. 100 rupees = 10000 paise.
  IMPS row: n = 1. T = 2026-08-10. due_date = T + 1 = 2026-08-11
  No REVERSAL_POSTED; as_of IST date 2026-08-20 > 2026-08-11: BREACHED.
  days_late = 2026-08-20 - 2026-08-11 = 9. Accrued to as_of: 10000 x 9 = 90000 paise (Rs 900).
  Required action: REVERSE_TRANSACTION.
entity_profile:
  entity_type: COMMERCIAL_BANK
  outlets: 120
  outlets_as_on: 2025-03-31
  home_branch_state: MH
events:
  - type: BANK_RECEIVED
    occurred_at: 2026-08-12T10:00:00+05:30
    payload: {issue_type: FAILED_TRANSACTION, channel: IMPS, transaction_date_t: "2026-08-10", amount_paise: 1200000}
as_of: 2026-08-20T12:00:00+05:30
expect:
  results:
    TAT-2019-FAILED-TXN: BREACHED
  deadlines:
    - {obligation_id: TAT-2019-FAILED-TXN, due_date: 2026-08-11, result: BREACHED}
  breaches:
    - {obligation_id: TAT-2019-FAILED-TXN, due_date: 2026-08-11, days_late: 9}
  compensation_paise:
    TAT-2019-FAILED-TXN: 90000
  required_actions:
    - {obligation_id: TAT-2019-FAILED-TXN, action: REVERSE_TRANSACTION}
