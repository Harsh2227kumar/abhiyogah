name: failed_txn_aeps_merchant_late
description: >
  A failed AePS merchant transaction is reversed one day after T+5; the bank owes ₹100. The illegible
  AePS beneficiary row does not apply.
obligation_ids: [TAT-2019-FAILED-TXN, TAT-2019-ILLEGIBLE-ROWS]
hand_check: |
  Source: RBI/2019-20/67 Annex (report Table B, row B1, verification P): AePS merchant T+5, ₹100/day,
  calendar days (T is a calendar date: EXPLICIT). 100 rupees = 10000 paise.
  AEPS_MERCHANT row: n = 5. T = 2026-08-10. due_date = T + 5 = 2026-08-15
  REVERSAL_POSTED R = 2026-08-16 > 2026-08-15: STOPPED_LATE, days_late = 1.
  compensation = 10000 x 1 = 10000 paise (Rs 100).
  B2 (row B2, U): condition "channel in [CARD_NOT_PRESENT, AEPS_BENEFICIARY]" is false: NOT_TRIGGERED.
entity_profile:
  entity_type: COMMERCIAL_BANK
  outlets: 120
  outlets_as_on: 2025-03-31
  home_branch_state: MH
events:
  - type: BANK_RECEIVED
    occurred_at: 2026-08-11T10:00:00+05:30
    payload: {issue_type: FAILED_TRANSACTION, channel: AEPS_MERCHANT, transaction_date_t: "2026-08-10", amount_paise: 300000}
  - type: REVERSAL_POSTED
    occurred_at: 2026-08-16T11:00:00+05:30
as_of: 2026-08-18T12:00:00+05:30
expect:
  results:
    TAT-2019-FAILED-TXN: STOPPED_LATE
    TAT-2019-ILLEGIBLE-ROWS: NOT_TRIGGERED
  deadlines:
    - {obligation_id: TAT-2019-FAILED-TXN, due_date: 2026-08-15, result: STOPPED_LATE}
  breaches:
    - {obligation_id: TAT-2019-FAILED-TXN, due_date: 2026-08-15, days_late: 1}
  compensation_paise:
    TAT-2019-FAILED-TXN: 10000
  required_actions: []
