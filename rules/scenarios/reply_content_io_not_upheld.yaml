name: reply_content_io_not_upheld
description: >
  The IO did not uphold the rejection, so the reply needs no IO-review statement; the other five elements make it complete.
obligation_ids: [IO-CB-2026-14-11-12]
hand_check: |
  Source: IO Directions 2026 cl. 14(11)-(12) (report Table A, row A18, verification P): a partial or
  rejected reply after IO review states that the IO reviewed it (if upheld) and advises the RB-IOS
  option with complete complaint details, cms.rbi.org.in and the CRPC postal and email address.
  required_elements = [RBIOS_OPTION_ADVICE, RBIOS_COMPLETE_COMPLAINT_DETAILS, CMS_PORTAL_LINK,
  CRPC_POSTAL_ADDRESS, CRPC_EMAIL_ADDRESS]; required_elements_if_io_upheld = [IO_REVIEW_STATEMENT].
  reply_elements and io_upheld are ComplaintFacts facts (reply QA perceives the elements; the
  check here decides).
  io_upheld = false: only the 5 required_elements apply; all 5 present.
  missing_elements = [], reply_complete = true.
