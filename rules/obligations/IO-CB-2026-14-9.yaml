# A17 (report Table A row A17; formula "final_reply_due = bank_receipt + 30d"): the bank's final
# decision must reach the complainant within 30 days of the bank's receipt of the complaint. The IO's
# reasoned-decision record (cl. 14(10)) has no per-complaint clock in the report and is not encoded.
# Pause while waiting for customer documents is not researched (Q3): the clock never pauses.
obligation_id: IO-CB-2026-14-9
deontic: OBLIGATION
subject: bank
instrument: "RBI (Commercial Banks – Internal Ombudsman) Directions, 2026"
instrument_ref: "RBI/CEPD/2025-26/381; CEPD.PRD.No.S1027/13.01.019/2025-26"
clause: "14(9)"
source_url: "https://sbi.bank.in/documents/53471/53742/11082026_Annexure+I-RBI+Commercial+Banks-Internal+Ombudsman+Directions+2026.pdf/7a497eab-60d3-155f-e5cd-357b80ebda24"
applies_to: {entity_type: COMMERCIAL_BANK, min_outlets: 10, outlets_as_on: 2025-03-31}  # A12, cl. 3
trigger: {event: BANK_RECEIVED}
clock: {start: BANK_RECEIVED, stop: FINAL_REPLY_SENT, basis: CALENDAR, basis_status: INFERRED, tz: Asia/Kolkata}
parameters:
  max_days:
    "2026-01-14": {value: 30, reference: "cl. 14(9)", verification: PRIMARY_TEXT_READ, open_question: Q4}
valid_from: 2026-01-14
valid_to: null
status: DRAFT
verification: PRIMARY_TEXT_READ
supersedes_note: "MD-IO 2023 (29 Dec 2023); clause mapping not verified"
tests:
