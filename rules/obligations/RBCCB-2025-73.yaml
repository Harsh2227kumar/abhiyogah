# B7 (report Table B row B7; clock table "Liability determination"; formula "determination at
# receipt + 90d"): the bank resolves the complaint and establishes the customer's liability within
# the time in its board policy, which may not exceed 90 days from receipt. If it is unresolved by day
# 90, the bank pays compensation as set out in paras 67-72, with no loss of interest (debit) or extra
# interest (credit card). Only the 90-day outer limit is encoded: each bank's shorter board-policy
# time is not known. The compensation amount depends on the B5 tier and is not computed here; the
# breach raises the action COMPENSATE_PER_PARAS_67_72 instead.
# "Days" read as calendar days is an inference (Q4). No pause is stated.
