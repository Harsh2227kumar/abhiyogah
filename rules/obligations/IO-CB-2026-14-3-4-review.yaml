# A15, senior-review limb (report Table A row A15): a partially resolved or wholly rejected complaint
# is reviewed "at a fairly senior level" before it goes to the IO. Clause mapping within 14(3)-(4)
# and the 30 Jun 2026 date: see IO-CB-2026-14-3-4-closure and Q16. "Fairly senior" is not defined
# in the report; the engine only checks that a senior review was recorded, not the reviewer's rank.
# Check obligation: senior_review_date is set and is on or before io_referred_date.
# Needs the fact senior_review_date / event SENIOR_REVIEWED (requested in tasks/02-rule-pack.md).
obligation_id: IO-CB-2026-14-3-4-review
deontic: OBLIGATION
subject: bank
instrument: "RBI (Commercial Banks – Internal Ombudsman) Directions, 2026"
instrument_ref: "RBI/CEPD/2025-26/381; CEPD.PRD.No.S1027/13.01.019/2025-26"
clause: "14(3)-(4)"
source_url: "https://sbi.bank.in/documents/53471/53742/11082026_Annexure+I-RBI+Commercial+Banks-Internal+Ombudsman+Directions+2026.pdf/7a497eab-60d3-155f-e5cd-357b80ebda24"
applies_to: {entity_type: COMMERCIAL_BANK, min_outlets: 10, outlets_as_on: 2025-03-31}  # A12, cl. 3
trigger: {event: OUTCOME_SET, condition: "outcome in [PARTIALLY_RESOLVED, WHOLLY_REJECTED]"}
valid_from: 2026-01-14
valid_to: null
status: DRAFT
verification: PRIMARY_TEXT_READ
tests:
  - senior_review_before_io.yaml
  - senior_review_pending.yaml
  - senior_review_skipped_before_io.yaml
