# B1 (report Table B row B1, verified rows only): a failed transaction must be reversed (funds received,
# R) within the channel's TAT counted from the transaction date T; for each day of delay beyond
# T + n the bank pays ₹100 suo motu, without a claim. Report formula: 100 × max(0, R − (T + n)) rupees,
# in calendar days (T is defined as a calendar date: basis EXPLICIT). The claimed switch to working
# days from 1 Jan 2021 (B3) is unverified and treated as false (Q6).
# Rows: ATM / micro-ATM T+5; card-to-card T+1; PoS card-present T+5; IMPS T+1; UPI P2P T+1; UPI
# merchant T+5; AePS merchant T+5; APBS T+1; NACH credit/reversal and NACH debit despite revocation
# T+1; PPI on-us T+1; PPI off-us follows the underlying system. The illegible rows (card-not-present,
# AePS beneficiary, NACH-revoked compensation) are B2 (TAT-2019-ILLEGIBLE-ROWS), UNVERIFIED.
# NACH is one Channel, so this table's compensation also covers NACH debit despite revocation, whose
# compensation row (7b) is illegible (B2, UNVERIFIED, Q5); the TAT itself (T+1) is verified here.
# AePS has two rows (merchant T+5 here, beneficiary T+1 in B2) and Channel has one AEPS member, so the
# row key is AEPS_MERCHANT and a complaint with channel AEPS gets INSUFFICIENT_FACTS until the channel
# is split (requested, issue #20). PPI off-us needs the underlying system: INSUFFICIENT_FACTS for now.
# Payee rule (beneficiary for delayed credit-push, originator for delayed initiation) is not yet an
# output. Placement in the 2025 consolidated directions is unconfirmed (Q9).
