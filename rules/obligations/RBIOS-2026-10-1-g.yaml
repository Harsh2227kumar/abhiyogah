# A3 (report Table A row A3): the complainant must file with RBI within 90 days of the later of the
# A2 expiry and the bank's last communication; a late filing is non-maintainable. A PERMISSION of the
# complainant: a lapsed window is never a bank breach. Report formula:
#   filing_deadline = max(bank_deadline, last_bank_communication) + 90d
# with bank_deadline from A2 (max(30, external TAT) days after bank receipt).
# The 2021 comparator (report row A3, grade S): one year, or one year + 30 days if no reply, i.e. the
# same shape with a one-year window. Which version applies follows RBI's receipt date (cl. 20(2),
# A1), so the anchor is rbi_receipt_date; before RBI has received the complaint the as_of date stands
# in ("if filed now"). The 2021 scheme's commencement date is UNVERIFIED (Q15).
