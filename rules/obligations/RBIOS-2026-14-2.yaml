# A5 (report Table A row A5; clock table "RBIO written response"): when the Ombudsman forwards a
# complaint with a direction, the bank files its written response with the documents it relies on
# within 15 days, extendable on written request. Without it the Ombudsman may pass an ex-parte award
# (cl. 14(3)) and the bank is deemed to have no information (cl. 13(2)).
# The extension is granted by the Ombudsman for a period the report does not give; there is no event
# for it, so it is not encoded (Q18): the 15 days never stretch. "Days" read as calendar (Q4).
