# A14 (report Table A row A14): every complaint is closed with one of exactly three outcomes, "Fully
# Resolved", "Partially Resolved" or "Wholly Rejected"; compliance by 30 Jun 2026. A check obligation
# (rules/obligations/_conventions.md): when the final reply goes out, the outcome must already be
# recorded. The Outcome enum already refuses any fourth value, so the check is that one of the three
# was set on or before the final reply.
# Out-of-purview complaints under cl. 14(5)(c)-(e) are exempt. The exclusion_category fact exists,
# but the condition grammar cannot say "unknown, or not in [14_5_c, 14_5_d, 14_5_e]" (a clause on an
# unknown fact is false), so the exemption is not applied yet: an exempt complaint is flagged and
# needs human review (request in tasks/02-rule-pack.md).
# The parameter is dated from the compliance date and resolved at final_reply_date, so replies sent
# before 30 Jun 2026 are NOT_APPLICABLE.
obligation_id: IO-CB-2026-14-2
deontic: OBLIGATION
subject: bank
instrument: "RBI (Commercial Banks – Internal Ombudsman) Directions, 2026"
instrument_ref: "RBI/CEPD/2025-26/381; CEPD.PRD.No.S1027/13.01.019/2025-26"
clause: "14(2)"
source_url: "https://sbi.bank.in/documents/53471/53742/11082026_Annexure+I-RBI+Commercial+Banks-Internal+Ombudsman+Directions+2026.pdf/7a497eab-60d3-155f-e5cd-357b80ebda24"
applies_to: {entity_type: COMMERCIAL_BANK, min_outlets: 10, outlets_as_on: 2025-03-31}  # A12, cl. 3
trigger: {event: FINAL_REPLY_SENT}
anchor: final_reply_date
parameters:
  allowed_outcomes:
    "2026-06-30": {value: [FULLY_RESOLVED, PARTIALLY_RESOLVED, WHOLLY_REJECTED],
                   reference: "cl. 14(2); compliance by 30 Jun 2026 (report row A14)", verification: PRIMARY_TEXT_READ}
valid_from: 2026-01-14
valid_to: null
status: DRAFT
verification: PRIMARY_TEXT_READ
tests:
  - outcome_classified_before_reply.yaml
  - outcome_missing_at_closure.yaml
  - outcome_set_after_closure.yaml
  - outcome_reply_before_compliance_date.yaml
  - outcome_no_reply_yet.yaml
