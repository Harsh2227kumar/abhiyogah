# DEMO FIXTURE: copied from origin/agent/rules @ 5baaca9 (PR #16, in owner review), with the
# scenario 'tests:' list removed. Replaced by rules/obligations/ once #16 merges (tasks/08-integrator.md).
# A13, external-TAT limb (report Table A row A13; formula "io_due = external_TAT_deadline − 10d").
# Where an RBI/NPCI/card-network TAT applies, a partially resolved or wholly rejected complaint must
# reach the IO early enough to leave the IO at least 10 days within that TAT. Overrides limb (b).
# The TAT deadline is taken as bank receipt + external_tat_days: that anchor is inferred (Q14), and
# network stage TATs themselves are unverified (Q8), so they arrive as a bank-supplied fact.
obligation_id: IO-CB-2026-14-1-a
deontic: OBLIGATION
subject: bank
instrument: "RBI (Commercial Banks – Internal Ombudsman) Directions, 2026"
instrument_ref: "RBI/CEPD/2025-26/381; CEPD.PRD.No.S1027/13.01.019/2025-26"
clause: "14(1)(a)"
source_url: "https://sbi.bank.in/documents/53471/53742/11082026_Annexure+I-RBI+Commercial+Banks-Internal+Ombudsman+Directions+2026.pdf/7a497eab-60d3-155f-e5cd-357b80ebda24"
applies_to: {entity_type: COMMERCIAL_BANK, min_outlets: 10, outlets_as_on: 2025-03-31}  # A12, cl. 3
trigger:
  event: OUTCOME_SET
  condition: "outcome in [PARTIALLY_RESOLVED, WHOLLY_REJECTED] and external_tat_days is set"
clock: {start: BANK_RECEIVED, stop: IO_REFERRED, basis: CALENDAR, basis_status: INFERRED, tz: Asia/Kolkata}
parameters:
  io_review_days:
    "2026-01-14": {value: 10, reference: "cl. 14(1)(a)", verification: PRIMARY_TEXT_READ, open_question: Q14}
valid_from: 2026-01-14
valid_to: null
status: DRAFT
verification: PRIMARY_TEXT_READ
supersedes_note: "MD-IO 2023 (29 Dec 2023); clause mapping not verified"
