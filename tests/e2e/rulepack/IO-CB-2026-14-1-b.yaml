# A13, ordinary limb (report Table A row A13; example YAML in the report's architecture section).
# A partially resolved or wholly rejected complaint must reach the IO within 20 days of receipt.
# When an RBI/NPCI/card-network TAT applies, limb (a) replaces this deadline (overridden_by), so this
# limb only triggers when no external TAT is known.
obligation_id: IO-CB-2026-14-1-b
deontic: OBLIGATION
subject: bank
instrument: "RBI (Commercial Banks – Internal Ombudsman) Directions, 2026"
instrument_ref: "RBI/CEPD/2025-26/381; CEPD.PRD.No.S1027/13.01.019/2025-26"
clause: "14(1)(b)"
source_url: "https://sbi.bank.in/documents/53471/53742/11082026_Annexure+I-RBI+Commercial+Banks-Internal+Ombudsman+Directions+2026.pdf/7a497eab-60d3-155f-e5cd-357b80ebda24"
applies_to: {entity_type: COMMERCIAL_BANK, min_outlets: 10, outlets_as_on: 2025-03-31}  # A12, cl. 3
trigger:
  event: OUTCOME_SET
  condition: "outcome in [PARTIALLY_RESOLVED, WHOLLY_REJECTED] and external_tat_days is not set"
clock: {start: BANK_RECEIVED, stop: IO_REFERRED, basis: CALENDAR, basis_status: INFERRED, tz: Asia/Kolkata}
parameters:
  max_days:
    "2026-01-14": {value: 20, reference: "cl. 14(1)(b)", verification: PRIMARY_TEXT_READ, open_question: Q4}
overridden_by: [IO-CB-2026-14-1-a]
valid_from: 2026-01-14
valid_to: null
status: DRAFT
verification: PRIMARY_TEXT_READ
supersedes_note: "MD-IO 2023 (29 Dec 2023); clause mapping not verified"
