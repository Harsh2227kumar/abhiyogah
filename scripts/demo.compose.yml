# Demo overrides for docker-compose.yml, used by `make demo` (scripts/dev.py; do not start it by hand).
# The rule pack is rules/obligations/ (agent-written DRAFT rules, not signed off); the bank profile
# is synthetic. API keys are generated per run by `make demo` and never stored.
x-demo-env: &demo-env
  ABHIYOGAH_RULES_DIR: rules/obligations
  ABHIYOGAH_API_KEYS: ${ABHIYOGAH_DEMO_API_KEYS:?start the demo with make demo}
  ABHIYOGAH_PROFILE: >-
    {"entity_type": "COMMERCIAL_BANK", "outlets": 120, "outlets_as_on": "2025-03-31",
    "home_branch_state": "MH"}

services:
  api:
    environment: *demo-env
  worker:
    environment: *demo-env
