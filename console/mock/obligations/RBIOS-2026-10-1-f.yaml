# A2 (report Table A row A2): the complainant may go to the RBI Ombudsman if the bank has not replied
# within 30 days of receipt, or within an RBI/NPCI/card-network TAT if that is longer, or if the
# complainant is dissatisfied with the reply. A maintainability condition, so a PERMISSION of the
# complainant: it opens the escalation route and is never a bank breach (the bank's own 30-day duty
# is A17, IO-CB-2026-14-9). Report formulas:
#   bank_deadline = max(bank_receipt + 30d, bank_receipt + external_TAT)
#   escalation_open = no_reply_by(bank_deadline) OR customer_dissatisfied
obligation_id: RBIOS-2026-10-1-f
deontic: PERMISSION
subject: complainant
instrument: "Reserve Bank – Integrated Ombudsman Scheme, 2026"
# instrument_ref omitted: final circular number not found (Q1)
