name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Every command must work on Windows too (CLAUDE.md "Commands"), so the gate runs on both.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # Console checks (lint, typecheck, vitest) run in `make check` only where pnpm exists.
      # The pnpm version comes from console/package.json's `packageManager`, so there is one pin.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"  # console/package.json engines: node >= 22
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - name: Setup
        if: runner.os != 'Windows'
        run: make setup
      - name: Check
        if: runner.os != 'Windows'
        run: make check
      # Windows runners have no GNU make; make.cmd runs the same targets (scripts/dev.py).
      - name: Setup (Windows)
        if: runner.os == 'Windows'
        run: .\make.cmd setup
      - name: Check (Windows)
        if: runner.os == 'Windows'
        run: .\make.cmd check
